<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Make the Call — Live board</title>
<style>
:root{
  --plane:#f3efe6; --surface:#ffffff; --surface2:#f7f3ea; --surface3:#ece6d9;
  --border:rgba(35,30,20,.11); --border2:rgba(35,30,20,.20);
  --ink:#241f17; --ink2:#5f594d; --muted:#938c7d;
  --accent:#1f6b4a; --accent2:#2e7d5b; --accentDim:rgba(31,107,74,.10);
  --good:#0a9d34; --warn:#c2830a; --crit:#cf3b3b; --aqua:#12a06f;
  --shadow:0 4px 16px -6px rgba(45,38,22,.16);
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--plane);color:var(--ink);min-height:100vh;line-height:1.45;
  background-image:radial-gradient(760px 420px at 6% -60px,rgba(31,107,74,.11),transparent 64%),radial-gradient(720px 400px at 98% 2%,rgba(46,125,91,.10),transparent 60%);
  background-attachment:fixed;}
.wrap{padding:1.4rem clamp(16px,2.2vw,40px) 2rem;}

/* top bar */
.top{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap;margin-bottom:1.4rem;}
.brand{font-size:clamp(1.6rem,2.4vw,2.4rem);font-weight:800;letter-spacing:-.8px;line-height:1;
  background:linear-gradient(92deg,#123f2b,#1f6b4a 55%,#2e7d5b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.live{display:inline-flex;align-items:center;gap:7px;font-size:.75rem;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);
  background:var(--accentDim);border:1px solid rgba(31,107,74,.28);padding:5px 12px;border-radius:99px;}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite;}
.live.off{color:var(--crit);background:rgba(207,59,59,.08);border-color:rgba(207,59,59,.3);} .live.off .dot{background:var(--crit);animation:none;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,107,74,.45);}70%{box-shadow:0 0 0 8px rgba(31,107,74,0);}100%{box-shadow:0 0 0 0 rgba(31,107,74,0);}}
.stats{display:flex;gap:.6rem;flex-wrap:wrap;margin-left:auto;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.45rem 1rem;box-shadow:var(--shadow);text-align:center;min-width:92px;}
.stat b{display:block;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums;}
.stat span{font-size:.68rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
.ctrl{display:flex;gap:.4rem;}
.btn{border:1px solid var(--border);background:var(--surface2);color:var(--ink2);font-family:var(--font);font-size:.78rem;font-weight:650;
  padding:.45rem .8rem;border-radius:9px;cursor:pointer;}
.btn:hover{border-color:var(--border2);color:var(--ink);}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff;}

/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.6rem;align-items:start;}
@media (max-width:1100px){.cols{grid-template-columns:1fr;}}
.sec-h{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.8rem;}
.sec-h h2{font-size:1.15rem;font-weight:750;letter-spacing:-.3px;}
.sec-h span{font-size:.8rem;color:var(--muted);}
.empty{border:1.5px dashed var(--border2);border-radius:18px;padding:2.2rem 1.4rem;text-align:center;color:var(--muted);font-size:.95rem;}

/* table tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem;}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1rem 1.1rem 1.05rem;box-shadow:var(--shadow);position:relative;
  transition:border-color .3s,opacity .3s;}
.tile.analysis{border-color:rgba(31,107,74,.35);}
.tile.warn{border-color:rgba(194,131,10,.55);}
.tile.danger{border-color:rgba(207,59,59,.6);}
.tile.done,.tile.lobby{opacity:.72;}
.tile-name{font-size:1.2rem;font-weight:750;letter-spacing:-.3px;padding-right:1.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-case{font-size:.78rem;color:var(--muted);margin-top:1px;}
.x{position:absolute;top:.6rem;right:.6rem;border:none;background:none;color:var(--muted);font-size:1rem;cursor:pointer;padding:2px 6px;border-radius:6px;font-family:var(--font);}
.x:hover{background:var(--surface3);color:var(--ink);}
.x.arm{background:var(--crit);color:#fff;font-size:.7rem;font-weight:700;}
.outdated{margin-top:.45rem;font-size:.72rem;font-weight:700;color:#946608;background:#fbf1d8;border:1px solid #f2e3ba;border-radius:8px;padding:.3rem .55rem;}
.offline{display:inline-block;margin-left:.4rem;font-size:.6rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--crit);vertical-align:middle;}
.pipe{display:flex;gap:4px;margin:.8rem 0 .7rem;}
.pipe div{flex:1;}
.pipe i{display:block;height:5px;border-radius:3px;background:var(--surface3);}
.pipe div.on i{background:var(--accent);} .pipe div.cur i{background:var(--accent2);animation:blink 1.6s ease-in-out infinite;}
.pipe span{display:block;font-size:.6rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-top:4px;}
.pipe div.cur span{color:var(--accent);}
@keyframes blink{50%{opacity:.45;}}
.clock{font-size:2.6rem;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);}
.clock.warn{color:var(--warn);} .clock.danger{color:var(--crit);}
.clock.small{font-size:1.25rem;letter-spacing:-.4px;color:var(--ink2);}
.status{font-size:.82rem;color:var(--ink2);margin-top:.3rem;min-height:1.2em;}
.meter{display:flex;align-items:center;gap:.5rem;margin-top:.7rem;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.meter .bar{flex:1;height:6px;border-radius:3px;background:var(--surface3);overflow:hidden;}
.meter .fill{height:100%;border-radius:3px;transition:width .4s;}

/* leaderboard */
.board{display:flex;flex-direction:column;gap:.9rem;}
.res{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1rem 1.15rem;box-shadow:var(--shadow);}
.res.fresh{animation:fresh 2.4s ease;}
@keyframes fresh{0%{box-shadow:0 0 0 4px rgba(31,107,74,.55);transform:scale(1.015);}100%{box-shadow:var(--shadow);transform:none;}}
.res-head{display:flex;align-items:center;gap:.9rem;}
.rank{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;flex-shrink:0;
  background:var(--surface3);color:var(--ink2);}
.rank.r1{background:#d9a514;color:#fff;} .rank.r2{background:#a8aab0;color:#fff;} .rank.r3{background:#b8763e;color:#fff;}
.res-name{font-size:1.2rem;font-weight:750;letter-spacing:-.3px;line-height:1.15;}
.res-case{font-size:.76rem;color:var(--muted);}
.res-score{margin-left:auto;text-align:right;}
.res-score b{display:block;font-size:2.3rem;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;}
.res-score span{font-size:.68rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
.res-body{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1.1rem;margin-top:.85rem;padding-top:.8rem;border-top:1px solid var(--border);}
@media (max-width:560px){.res-body{grid-template-columns:1fr;}}
.lbl{font-size:.62rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem;}
.call{font-size:.86rem;font-weight:650;line-height:1.3;}
.q{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-top:.3rem;}
.q.best{background:#dff5ec;color:#0c7c54;} .q.good{background:#fbf1d8;color:#946608;} .q.poor{background:#fbe4e4;color:#b83636;}
.segs{display:flex;gap:.3rem;flex-wrap:wrap;}
.seg{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:7px;border:1px solid;}
.seg.ok{background:#dff5ec;color:#0c7c54;border-color:#c2ead9;} .seg.no{background:#fbe4e4;color:#b83636;border-color:#f2caca;}
.na{font-size:.78rem;color:var(--muted);}
.ev{display:flex;flex-direction:column;gap:.2rem;}
.ev div{font-size:.8rem;display:flex;align-items:center;gap:.4rem;line-height:1.25;}
.ev i{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ev i.high{background:var(--good);} .ev i.medium{background:var(--warn);} .ev i.low{background:var(--crit);}
.trap{font-size:.58rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--crit);padding:1px 6px;border-radius:99px;}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface3);margin-top:.35rem;}
.split div{height:100%;}
.legend{display:flex;gap:.7rem;flex-wrap:wrap;font-size:.68rem;color:var(--muted);margin-top:.3rem;}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:0;}
.btn-primary{background:linear-gradient(92deg,#24764f,#174d36);border:none;color:#fff;font-size:1.05rem;font-weight:700;padding:.85rem 1.6rem;border-radius:12px;
  box-shadow:0 6px 22px -8px rgba(23,77,54,.7);cursor:pointer;font-family:var(--font);}
.btn-primary:hover{transform:translateY(-1px);}
.btn-primary:disabled{background:var(--surface3);color:var(--muted);box-shadow:none;cursor:not-allowed;transform:none;}
.locked{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:2rem 1.6rem;box-shadow:var(--shadow);text-align:center;}
.lock-ic{width:58px;height:58px;border-radius:50%;margin:0 auto .9rem;display:flex;align-items:center;justify-content:center;background:var(--accentDim);color:var(--accent);}
.lock-ic svg{width:28px;height:28px;}
.locked h3{font-size:1.35rem;font-weight:750;letter-spacing:-.3px;}
.locked p{color:var(--ink2);margin:.35rem 0 1.2rem;}
.done-chips{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;margin-bottom:1.4rem;}
.done-chip{font-size:.9rem;font-weight:650;padding:.4rem .85rem;border-radius:99px;background:#dff5ec;color:#0c7c54;border:1px solid #c2ead9;}
.done-chip.wait{background:var(--surface2);color:var(--muted);border-color:var(--border);}
.reveal-head{display:flex;align-items:baseline;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap;}
.reveal-head h2{font-size:clamp(1.4rem,2vw,2rem);font-weight:800;letter-spacing:-.6px;}
.reveal-head span{color:var(--muted);font-size:.9rem;}
.board.wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:1rem;align-items:start;}
.res.pop{opacity:0;animation:pop .7s cubic-bezier(.2,.9,.3,1.2) forwards;}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96);}to{opacity:1;transform:none;}}
.res.winner{border:2px solid #d9a514;box-shadow:0 0 0 6px rgba(217,165,20,.14),var(--shadow);}
.still{margin-top:1.4rem;display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;font-size:.85rem;color:var(--muted);}
.still b{color:var(--ink2);font-weight:650;margin-right:.3rem;}
.confirm-wrap{position:fixed;inset:0;background:rgba(36,31,23,.38);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;}
.confirm{background:var(--surface);border-radius:18px;padding:1.6rem 1.6rem 1.3rem;max-width:440px;box-shadow:0 20px 50px -18px rgba(0,0,0,.45);}
.confirm h3{font-size:1.25rem;font-weight:750;margin-bottom:.4rem;}
.confirm p{color:var(--ink2);font-size:.92rem;margin-bottom:1.2rem;}
.confirm-row{display:flex;gap:.5rem;justify-content:flex-end;}
.confirm-row .btn{font-size:.9rem;padding:.6rem 1rem;}
.why{margin-top:.85rem;padding-top:.8rem;border-top:1px solid var(--border);}
.why blockquote{font-size:1rem;line-height:1.5;color:var(--ink);font-style:italic;border-left:3px solid var(--accent);padding:.15rem 0 .15rem .8rem;}
.unsure{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-top:.6rem;}
.unsure .lbl{margin:0 .2rem 0 0;}
.unsure .u{font-size:.72rem;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--accentDim);color:var(--accent);}
.reading{margin-top:.5rem;font-size:.72rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--crit);display:inline-block;padding:3px 9px;border-radius:99px;animation:blink 1.4s ease-in-out infinite;}
.newsrow{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-top:.8rem;}
.newsrow .lbl{margin:0 .2rem 0 0;}
.nr{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--ink2);}
.nr.ok{background:#dff5ec;color:#0c7c54;border-color:#c2ead9;} .nr.no{background:#fbe4e4;color:#b83636;border-color:#f2caca;}
[hidden]{display:none!important;}
#news-banner{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(36,31,23,.45);backdrop-filter:blur(3px);animation:bnin .45s ease;}
@keyframes bnin{from{opacity:0;}to{opacity:1;}}
.bn-box{background:var(--surface);border-radius:28px;max-width:980px;width:100%;padding:3rem 3.2rem 2.6rem;text-align:center;border-top:12px solid var(--crit);
  box-shadow:0 40px 90px -30px rgba(0,0,0,.55);animation:bnpop .6s cubic-bezier(.2,.9,.3,1.25);}
@keyframes bnpop{from{transform:scale(.85);opacity:0;}to{transform:none;opacity:1;}}
.bn-flag{display:inline-flex;align-items:center;gap:12px;font-size:clamp(1rem,1.6vw,1.4rem);font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#fff;background:var(--crit);padding:.55rem 1.4rem;border-radius:99px;}
.bn-dot{width:14px;height:14px;border-radius:50%;background:#fff;animation:bnblink 1s infinite;}
@keyframes bnblink{50%{opacity:.2;}}
.bn-title{font-size:clamp(2rem,4.2vw,3.6rem);font-weight:850;letter-spacing:-1.5px;line-height:1.08;margin:1.4rem 0 .7rem;}
.bn-sub{font-size:clamp(1.05rem,1.7vw,1.5rem);color:var(--ink2);}
.bn-count{font-size:1.05rem;font-weight:700;color:var(--accent);margin-top:1.3rem;min-height:1.4em;}
.bn-bar{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden;margin-top:1.4rem;}
.bn-fill{height:100%;background:var(--crit);transition:width 1s linear;}
.tile.is-idle{border-color:rgba(194,131,10,.7);box-shadow:0 0 0 3px rgba(194,131,10,.12),var(--shadow);}
.idle{display:inline-block;margin:.55rem 0 .1rem;font-size:.72rem;font-weight:800;letter-spacing:.3px;color:#946608;background:#fbf1d8;border:1px solid #f2e3ba;border-radius:8px;padding:.25rem .55rem;}
.join{display:flex;align-items:center;gap:1.4rem;margin-top:1rem;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.1rem 1.3rem;box-shadow:var(--shadow);}
.join-qr{flex-shrink:0;background:#fff;padding:12px;border-radius:12px;border:1px solid var(--border);}
.qr-svg{display:block;width:clamp(150px,13vw,210px);height:auto;}
.join-h{font-size:1.25rem;font-weight:750;letter-spacing:-.3px;}
.join p{color:var(--ink2);margin:.25rem 0 .55rem;font-size:.95rem;}
.join-url{font-size:.85rem;font-weight:650;color:var(--accent);word-break:break-all;}
.setup{max-width:640px;margin:12vh auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:2rem;box-shadow:var(--shadow);}
.setup h2{margin-bottom:.6rem;} .setup p{color:var(--ink2);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="news-banner" hidden>
  <div class="bn-box">
    <div class="bn-flag"><span class="bn-dot"></span>Breaking news</div>
    <div class="bn-title">New information just landed on every table</div>
    <div class="bn-sub">Signal or noise? Each table has to take a stand — right now.</div>
    <div class="bn-count"></div>
    <div class="bn-bar"><div class="bn-fill"></div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

const STAGES=[['brief','Briefing'],['analysis','Analysis'],['decision','Decision'],['done','Done']];
const STEP_LABELS=['Decision','Evidence','Rationale'];
const LIVE_VERSION=3;          // must match index.html
const MAX_AGE=12*3600*1000;
const IDLE_MS=3*60*1000;       // no clicks/keys/scroll for this long → flagged idle   // ignore tables idle for more than 12 h
let tables={},revealed=false,newsState={},newsPlan=null,revealAnimated=new Set(),offset=0,connected=false,seenDone=new Set(),firstLoad=true,armed=null,armTimer=null,clearArmed=false;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now()+offset;
const fmt=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
const verdictColor=t=>t>=88?'var(--good)':t>=68?'var(--aqua)':t>=50?'var(--warn)':'var(--crit)';

function remaining(t){
  if(!t.analysisStart||!t.durationSec)return null;
  return t.analysisStart+t.durationSec*1000-now();
}
function active(){
  const n=now();
  return Object.entries(tables).filter(([,t])=>t&&t.name&&(!t.updatedAt||n-t.updatedAt<MAX_AGE)).map(([id,t])=>({id,...t}));
}

function idleMin(t){
  if(!['brief','analysis','decision'].includes(t.stage))return 0;
  const ms=now()-(t.activeAt||t.updatedAt||now());
  return ms>=IDLE_MS?Math.floor(ms/60000):0;
}
function tileHtml(t){
  const stageIdx=STAGES.findIndex(s=>s[0]===t.stage);
  const rem=remaining(t);
  let cls=t.stage||'lobby',clock='',status='';
  if(t.stage==='analysis'){
    if(rem===null){clock=`<div class="clock small">Reading the case</div>`;}
    else if(rem<=0||t.timeUp){clock=`<div class="clock danger">0:00</div>`;status='Time is up';cls+=' danger';}
    else{const c=rem<=60000?'danger':rem<=300000?'warn':'';clock=`<div class="clock ${c}" data-clock="${t.id}">${fmt(rem)}</div>`;if(c)cls+=' '+c;}
  }
  if(t.stage==='brief'){clock=`<div class="clock small">Reading the case</div>`;}
  if(t.stage==='analysis'&&!status)status=`Opening insights`;
  if(t.stage==='decision'){
    const step=t.decisionStep||1;
    clock=`<div class="clock small">Deciding</div>`;
    status=`Decision room · step ${step}/3 — ${STEP_LABELS[step-1]||''}`;
  }
  if(t.stage==='done'){clock=revealed&&t.result?`<div class="clock small" style="color:${verdictColor(t.result.total)}">${t.result.total} pts</div>`:`<div class="clock small" style="color:var(--good)">Finished ✓</div>`;status=revealed&&t.result?esc(t.result.verdict):'Waiting for the reveal';}
  if(t.stage==='lobby'){clock=`<div class="clock small">Between rounds</div>`;status=revealed&&t.result?`Last score ${t.result.total} pts`:'';}
  const pct=t.budget?Math.min(100,Math.round((t.spent||0)/t.budget*100)):0;
  const fill=(t.spent||0)<=t.budget?'var(--aqua)':(t.spent||0)<=t.red?'var(--warn)':'var(--crit)';
  if(idleMin(t))cls+=' is-idle';
  return `<div class="tile ${cls}">
    <button class="x ${armed===t.id?'arm':''}" onclick="removeTable('${t.id}')" title="Remove table">${armed===t.id?'Remove?':'×'}</button>
    <div class="tile-name">${esc(t.name)}${t.online===false?'<span class="offline">offline</span>':''}</div>
    ${(t.v||0)<LIVE_VERSION&&t.online!==false?'<div class="outdated">Old game version — ask this table to reload the page</div>':''}
    <div class="tile-case">${esc(t.caseName||'')}</div>
    <div class="pipe">${STAGES.map(([k,l],i)=>`<div class="${i<stageIdx||(k==='done'&&t.stage==='done')?'on':i===stageIdx?'cur':''}"><i></i><span>${l}</span></div>`).join('')}</div>
    ${idleMin(t)?`<div class="idle">Idle · no activity for ${idleMin(t)} min</div>`:''}
    ${clock}<div class="status">${status}</div>
    ${t.news&&Object.values(t.news).includes('pending')?'<div class="reading">Breaking news on screen</div>':''}
    ${revealed?`<div class="meter"><span>${t.opened||0}/${t.totalCards||12} insights</span><div class="bar"><div class="fill" style="width:${pct}%;background:${fill}"></div></div><span>${t.spent||0}/${t.budget||'–'} tokens</span></div>`:''}
  </div>`;
}

function resultHtml(t,rank,fresh,anim){
  const r=t.result;
  const qLabel={best:'Strongest call',good:'Sound but cautious',poor:'Data pointed elsewhere'}[r.quality]||'';
  const segs=r.segs?`<div class="segs">${r.segs.map(s=>`<span class="seg ${s.dec===s.best?'ok':'no'}" title="${esc(s.name)}">${esc(s.id)} ${s.dec===s.best?'✓':'✗'} ${esc(s.dec||'—')}</span>`).join('')}</div>`:`<div class="na">Not a targeted rollout</div>`;
  const ev=(r.top3||[]).length?`<div class="ev">${r.top3.map(c=>`<div><i class="${esc(c.value)}"></i>${esc(c.name)}${c.trap?' <span class="trap">trap</span>':''}</div>`).join('')}</div>`:`<div class="na">No evidence picked</div>`;
  const parts=[[r.decPts,'#1f6b4a','Decision'],[r.segPts,'#12a06f','Segment fit'],[r.evPts,'#2e7d5b','Evidence'],[r.discPts,'#c8860a','Discipline']];
  const newsLeg=(r.newsReactions||[]).length?`<span><i style="background:${r.newsPts<0?'#cf3b3b':'#0a9d34'}"></i>News ${r.newsPts>0?'+':''}${r.newsPts||0}</span>`:'';
  return `<div class="res ${fresh?'fresh':''} ${anim?'pop':''} ${rank===1?'winner':''}" ${anim?`style="animation-delay:${anim}s"`:''}>
    <div class="res-head">
      <div class="rank ${rank<=3?'r'+rank:''}">${rank}</div>
      <div><div class="res-name">${esc(t.name)}</div><div class="res-case">${esc(t.caseName||'')} · ${r.spent}/${r.budget} tokens</div></div>
      <div class="res-score"><b style="color:${verdictColor(r.total)}">${r.total}</b><span style="color:${verdictColor(r.total)}">${esc(r.verdict)}</span></div>
    </div>
    <div class="res-body">
      <div><div class="lbl">Their call</div><div class="call">${esc(r.decision)}</div><span class="q ${esc(r.quality)}">${qLabel}</span></div>
      <div><div class="lbl">Segment calls</div>${segs}</div>
      <div><div class="lbl">Top 3 evidence</div>${ev}</div>
      <div><div class="lbl">Score build-up${r.over?` · −${r.over} over-analysis`:''}</div>
        <div class="split">${parts.map(([v,c])=>`<div style="width:${v}%;background:${c}"></div>`).join('')}</div>
        <div class="legend">${parts.map(([v,c,l])=>`<span><i style="background:${c}"></i>${l} ${v}</span>`).join('')}${newsLeg}</div></div>
    </div>
    ${(r.newsReactions||[]).length?`<div class="newsrow"><span class="lbl">Breaking news</span>${r.newsReactions.map(n=>`<span class="nr ${n.pts>0?'ok':n.pts<0?'no':''}" title="${esc(n.headline)}">${esc({change:'Changed thinking',investigate:'Investigated',ignore:'Stayed the course'}[n.choice]||n.choice)} ${n.pts>0?'+':''}${n.pts}</span>`).join('')}</div>`:''}
    ${r.rationale||(r.unsure||[]).length?`<div class="why">
      ${r.rationale?`<blockquote>“${esc(r.rationale)}”</blockquote>`:''}
      ${(r.unsure||[]).length?`<div class="unsure"><span class="lbl">Still unsure about</span>${r.unsure.map(u=>`<span class="u">${esc(u)}</span>`).join('')}</div>`:''}
    </div>`:''}
  </div>`;
}

function render(){
  const list=active();
  const order={analysis:0,brief:1,decision:2,lobby:3,done:4};
  const inPlay=list.slice().sort((a,b)=>(order[a.stage]??5)-(order[b.stage]??5)||String(a.name).localeCompare(b.name));
  const done=list.filter(t=>t.result).sort((a,b)=>b.result.total-a.result.total||a.result.spent-b.result.spent);
  const count=k=>list.filter(t=>t.stage===k).length;
  const fresh=new Set();
  done.forEach(t=>{const key=t.id+':'+t.result.finishedAt;if(!seenDone.has(key)){seenDone.add(key);if(!firstLoad)fresh.add(t.id);}});
  firstLoad=false;
  const topBar=`
    <div class="top">
      <div class="brand">MAKE THE CALL</div>
      <span class="live ${connected?'':'off'}"><span class="dot"></span>${connected?'Live':'Connecting…'}</span>
      <div class="stats">
        <div class="stat"><b>${list.length}</b><span>Tables</span></div>
        <div class="stat"><b>${count('analysis')+count('brief')}</b><span>Analysing</span></div>
        <div class="stat"><b>${count('decision')}</b><span>Deciding</span></div>
        <div class="stat"><b>${done.length}</b><span>Finished</span></div>
      </div>
      <div class="ctrl">
        ${revealed?`<button class="btn" onclick="setReveal(false)">Hide results</button>`:''}
        <button class="btn" onclick="toggleFs()">Full screen</button>
        <button class="btn" onclick="clearBoard()">Clear board</button>
      </div>
    </div>`;

  const confirmHtml=clearArmed?`<div class="confirm-wrap" onclick="if(event.target===this)cancelClear()"><div class="confirm">
      <h3>Clear the whole board?</h3>
      <p>This removes all ${list.length} table${list.length!==1?'s':''} and their results, and locks the leaderboard again. Tables that still have the game open will reappear at their next step.</p>
      <div class="confirm-row"><button class="btn" onclick="cancelClear()">Cancel</button><button class="btn danger" onclick="confirmClear()">Yes, clear the board</button></div>
    </div></div>`:'';
  if(revealed){
    // Stagger the first appearance: last place first, the winner last.
    const n=done.length;
    const cards=done.map((t,i)=>{
      const key=t.id+':'+t.result.finishedAt;let anim=0;
      if(!revealAnimated.has(key)){revealAnimated.add(key);anim=0.2+(n-1-i)*0.55+(i===0?0.6:0);}
      return resultHtml(t,i+1,false,anim);
    }).join('');
    const playing=inPlay.filter(t=>!t.result);
    document.getElementById('app').innerHTML=topBar+`
      <div class="reveal-head"><h2>Results</h2><span>${done.length} table${done.length!==1?'s':''} · ranked by score, fewest tokens breaks a tie</span></div>
      ${done.length?`<div class="board wide">${cards}</div>`:`<div class="empty">No finished tables yet.</div>`}
      ${playing.length?`<div class="still"><b>Still playing:</b>${playing.map(t=>`<span class="done-chip wait">${esc(t.name)}</span>`).join('')}</div>`:''}`+confirmHtml;
    return;
  }

  const finishedNames=done.map(t=>`<span class="done-chip">✓ ${esc(t.name)}</span>`).join('');
  const waitingNames=inPlay.filter(t=>!t.result).map(t=>`<span class="done-chip wait">${esc(t.name)}</span>`).join('');
  document.getElementById('app').innerHTML=topBar+`
    <div class="cols">
      <section>
        <div class="sec-h"><h2>Tables in play</h2><span>15 min in the analysis room</span></div>
        ${inPlay.length?`<div class="tiles">${inPlay.map(tileHtml).join('')}</div>`:`<div class="empty">Waiting for tables… They appear here as soon as they enter a name and deal their case.</div>`}
      </section>
      <section>
        <div class="sec-h"><h2>Leaderboard</h2><span>locked until you reveal it</span></div>
        <div class="locked">
          <div class="lock-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
          <h3>${done.length} of ${list.length} table${list.length!==1?'s':''} finished</h3>
          <p>Scores, tokens and answers stay hidden until everyone is done.</p>
          ${finishedNames||waitingNames?`<div class="done-chips">${finishedNames}${waitingNames}</div>`:''}
          <button class="btn-primary" onclick="setReveal(true)" ${done.length?'':'disabled'}>Reveal results →</button>
        </div>
        <div class="join">
          <div class="join-qr">${JOIN_QR}</div>
          <div><div class="join-h">Joining late?</div><p>Scan to open the game, enter your table name and deal your case.</p><div class="join-url">${JOIN_URL}</div></div>
        </div>
      </section>
    </div>`+confirmHtml;
}

// ── Breaking news: two events at random times, sent to every active table at once ──
const NEWS_TEST=new URLSearchParams(location.search).has('test');   // host.html?test → news after 1 and 2 min
const NEWS_WINDOWS=NEWS_TEST?[[1,1],[2,2]]:[[7,7],[12,12]];   // minutes after the first table starts its analysis (fixed)
function planNews(){
  if(newsPlan)return;
  const starts=active().filter(t=>t.analysisStart&&!t.result).map(t=>t.analysisStart);
  if(!starts.length)return;
  const first=Math.min(...starts),rnd=([a,b])=>Math.round((a+Math.random()*(b-a))*60000);
  const plan={at1:first+rnd(NEWS_WINDOWS[0]),at2:first+rnd(NEWS_WINDOWS[1])};
  firebase.database().ref('live/state/newsPlan').transaction(cur=>cur||plan);
}
function sendNews(k){
  firebase.database().ref('live/state/news/'+k).transaction(cur=>cur||firebase.database.ServerValue.TIMESTAMP)
    .catch(e=>alertBar('Could not send breaking news: '+e.message));
}
function checkNews(){
  planNews();
  if(!newsPlan)return;
  if(!newsState.n1&&now()>=newsPlan.at1)sendNews('n1');
  else if(newsState.n1&&!newsState.n2&&now()>=newsPlan.at2)sendNews('n2');
}
// Big on-screen banner for 30 s whenever an event goes out to the tables.
const BANNER_MS=30000;
function updateNewsBanner(){
  const el=document.getElementById('news-banner');
  const k=['n2','n1'].find(k=>newsState[k]&&now()-newsState[k]<BANNER_MS);
  if(!k){el.hidden=true;return;}
  const left=BANNER_MS-(now()-newsState[k]);
  const got=active().filter(t=>t.news&&t.news[k]&&t.news[k]!=='missed');
  const done=got.filter(t=>t.news[k]!=='pending').length;
  el.hidden=false;
  el.querySelector('.bn-count').textContent=got.length?`${done} of ${got.length} table${got.length!==1?'s have':' has'} taken a stand`:'';
  el.querySelector('.bn-fill').style.width=Math.max(0,left/BANNER_MS*100)+'%';
}

// Only the clocks change every second — update them in place.
let idleSig='';
function tick(){
  checkNews();updateNewsBanner();
  const sig=active().map(t=>t.id+':'+idleMin(t)).join('|');
  if(sig!==idleSig){idleSig=sig;if(!revealed){render();return;}}
  const list=active();let needFull=false;
  list.forEach(t=>{
    const el=document.querySelector(`[data-clock="${t.id}"]`);if(!el)return;
    const rem=remaining(t);
    if(rem===null||rem<=0||(rem<=300000&&!el.classList.contains('warn')&&!el.classList.contains('danger'))||(rem<=60000&&!el.classList.contains('danger'))){needFull=true;return;}
    el.textContent=fmt(rem);
  });
  if(needFull)render();
}

function removeTable(id){
  if(armed!==id){armed=id;clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;render();},3000);render();return;}
  armed=null;firebase.database().ref('live/tables/'+id).remove().catch(e=>alertBar('Could not remove the table: '+e.message));
}
function clearBoard(){clearArmed=true;render();}
function cancelClear(){clearArmed=false;render();}
function confirmClear(){
  clearArmed=false;revealAnimated.clear();render();
  firebase.database().ref('live').update({'tables':null,'state/revealed':false,'state/news':null,'state/newsPlan':null})
    .then(()=>alertBar('Board cleared',true))
    .catch(e=>alertBar('Could not clear the board: '+e.message));
}
function setReveal(v){revealAnimated.clear();firebase.database().ref('live/state/revealed').set(v).catch(e=>alertBar('Could not update the reveal: '+e.message));}
function alertBar(msg,ok){let el=document.getElementById('alert-bar');if(!el){el=document.createElement('div');el.id='alert-bar';
  el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#cf3b3b;color:#fff;font-weight:650;padding:.7rem 1.2rem;border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:50;font-family:var(--font)';
  document.body.appendChild(el);}el.textContent=msg;el.style.background=ok?'#1f6b4a':'#cf3b3b';el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>{el.hidden=true;},6000);}
function toggleFs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}

if(!window.FB_CONFIG){
  document.getElementById('app').innerHTML=`<div class="setup"><h2>Live board isn't connected yet</h2><p>Add your Firebase config to <code>firebase-config.js</code> to see the tables here.</p></div>`;
}else{
  firebase.initializeApp(window.FB_CONFIG);
  const db=firebase.database();
  db.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0;});
  db.ref('.info/connected').on('value',s=>{connected=s.val()===true;render();});
  db.ref('live/tables').on('value',s=>{tables=s.val()||{};render();});
  db.ref('live/state/news').on('value',s=>{newsState=s.val()||{};render();updateNewsBanner();});
  db.ref('live/state/newsPlan').on('value',s=>{newsPlan=s.val();});
  db.ref('live/state/revealed').on('value',s=>{const v=s.val()===true;if(v!==revealed){revealed=v;if(!v)revealAnimated.clear();render();}});
  render();
  setInterval(tick,1000);
}
</script>
</body>
</html>
